name: AutoMap signed release

# Signed alpha releases (from 2026-10-28, alpha.7): the repo is public and
# alphas are signed with one stable release keystore, so a signed alpha
# updates in-app over the previous signed alpha. The first signed alpha
# still requires one last uninstall, because it cannot install over a
# debug-signed build.
#
# Signing: the keystore itself is NOT in this repo. It is stored as the
# GitHub secret AUTOMAP_KEYSTORE_BASE64 (base64 of the .jks file), with
# VELA_KEYSTORE_PASSWORD (store password, also the key password) and
# VELA_KEY_ALIAS (key alias) as secrets. app/build.gradle.kts already
# reads VELA_KEYSTORE_PATH / VELA_KEYSTORE_PASSWORD / VELA_KEY_ALIAS
# for its releaseFromEnv signing config, and falls back to debug signing
# if no keystore file exists — so this workflow fails loudly if the
# keystore secret is empty, instead of silently shipping a debug-signed
# "release". Secret VALUES never appear in this file or in any log.
#
# Manual-only, triggered only by workflow_dispatch, never by push.
# The debug workflow (automap-debug-release.yml) is left intact and
# separate; it is not used for signed alphas.
# The release tag follows the built versionName (v0.3.0-alpha.7, ...),
# one prerelease per alpha version, and the asset is the signed release
# APK named AutoMap-<version>.apk, which is what AutoMapUpdater picks
# (first AutoMap-*.apk asset on the release).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AutoMap source tree
        uses: actions/checkout@v4
        with:
          # Depth 2 so the Attach step can read the work commit's message
          # even when HEAD is a BUILD_LOG commit pushed after it.
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch obf routing runtime jars
        run: |
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL -o "core/libs/$f" \
              "https://github.com/${{ github.repository }}/releases/download/obf-runtime/$f" \
            || curl -fSL -o "core/libs/$f" \
              "https://github.com/PimpinPumpkin/Vela/releases/download/obf-runtime/$f"
          done
          test "$(stat -c%s core/libs/osmand-java.jar)" -gt 10000000

      - name: Fetch Cronet runtime AAR
        run: |
          v=$(sed -n 's/^vela.cronetVersion=//p' gradle.properties)
          f="app/libs/cronet-$v.aar"
          mkdir -p app/libs
          curl -fsSL -o "$f" "https://github.com/${{ github.repository }}/releases/download/cronet-runtime/cronet-$v.aar" \
          || curl -fsSL -o "$f" "https://github.com/PimpinPumpkin/Vela/releases/download/cronet-runtime/cronet-$v.aar" \
          || bash scripts/build-cronet-aar.sh "$v" app/libs
          test "$(stat -c%s "$f")" -gt 10000000

      - name: Fetch TTS runtime AAR
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/${{ github.repository }}/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar" \
          || curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/PimpinPumpkin/Vela/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar"
          test "$(stat -c%s app/libs/sherpa-onnx-1.13.3.aar)" -gt 50000000

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.AUTOMAP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed release APK (app.automap)
        env:
          VELA_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          VELA_KEYSTORE_PASSWORD: ${{ secrets.VELA_KEYSTORE_PASSWORD }}
          VELA_KEY_ALIAS: ${{ secrets.VELA_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease -PappId=app.automap --no-daemon

      - name: Verify the APK is release-signed, not debug-signed
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSigner" ]; then
            "$APKSigner" verify --print-certs "$APK" | tee /tmp/apksigner-certs.txt
            grep -q "Android Debug" /tmp/apksigner-certs.txt && { echo "ERROR: APK is debug-signed, refusing to publish as a release" >&2; exit 1; } || true
          else
            echo "apksigner not found on runner; signature verified after download instead"
          fi

      - name: Attach APK to the versioned alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/.*appVersionName.*\? *: *"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          ASSET="AutoMap-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          ls -lh "$ASSET"
          sha256sum "$ASSET"
          # Real per-build release notes (2026-10-28, alpha.16): the release
          # body is the work commit's message, which already carries the
          # full summary of what changed — NOT a hardcoded boilerplate
          # paragraph. The in-app Updates page shows this body before
          # Download, so a boilerplate body would show boilerplate,
          # not features. If HEAD is a BUILD_LOG commit (pushed after
          # the work commit), its parent is the work commit.
          if git log -1 --format=%B | grep -q 'BUILD_LOG'; then
            NOTES_COMMIT="HEAD~1"
          else
            NOTES_COMMIT="HEAD"
          fi
          git log -1 --format=%B "$NOTES_COMMIT" > /tmp/release-notes.txt
          test -s /tmp/release-notes.txt
          cat /tmp/release-notes.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --repo "$GITHUB_REPOSITORY" \
              --title "AutoMap $VERSION (alpha, signed)" \
              --notes-file /tmp/release-notes.txt
          # Always set the body from the work commit, so a re-run or a
          # pre-existing tag cannot leave stale boilerplate in place.
          gh release edit "$TAG" --notes-file /tmp/release-notes.txt --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
